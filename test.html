<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App - Syntax Check</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .test-result {
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
    </style>
</head>
<body>
    <h1>Weather App - Syntax Check</h1>
    <div id="results"></div>

    <script type="module">
        const results = document.getElementById('results');
        
        function addResult(message, type) {
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.textContent = message;
            results.appendChild(div);
        }

        try {
            addResult('Testing config.js module...', 'info');
            await import('./config.js');
            addResult('✓ config.js loaded successfully', 'success');
        } catch (error) {
            addResult(`✗ config.js error: ${error.message}`, 'error');
        }

        try {
            addResult('Testing api.js module...', 'info');
            await import('./api.js');
            addResult('✓ api.js loaded successfully', 'success');
        } catch (error) {
            addResult(`✗ api.js error: ${error.message}`, 'error');
        }

        try {
            addResult('Testing app.js module...', 'info');
            await import('./app.js');
            addResult('✓ app.js loaded successfully', 'success');
        } catch (error) {
            addResult(`✗ app.js error: ${error.message}`, 'error');
        }

        addResult('Syntax check complete! If all modules loaded successfully, your code is ready.', 'info');
    </script>
</body>
</html>
