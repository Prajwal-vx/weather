<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather app checks</title>
  <style>body{max-width:760px;margin:40px auto;padding:0 20px;font:16px system-ui;color:#1c2a3a}li{margin:10px 0}.pass{color:#24744a}.fail{color:#ad3829}</style>
</head>
<body>
  <h1>Weather app checks</h1>
  <p>Local checks for forecast parsing and input validation. These do not call the weather provider.</p>
  <ul id="results"></ul>
  <script type="module">
    import { getWeatherData, getWeatherDataByCoords, processForecastData } from './api.js';
    const results = document.getElementById('results');
    function check(name, run) {
      const item = document.createElement('li');
      try { run(); item.textContent = `PASS — ${name}`; item.className = 'pass'; }
      catch (error) { item.textContent = `FAIL — ${name}: ${error.message}`; item.className = 'fail'; }
      results.appendChild(item);
    }
    function rejects(name, run) {
      const item = document.createElement('li');
      try { run(); item.textContent = `FAIL — ${name}: input was accepted`; item.className = 'fail'; }
      catch { item.textContent = `PASS — ${name}`; item.className = 'pass'; }
      results.appendChild(item);
    }
    check('Forecast picks one representative near-noon reading per day', () => {
      const entries = ['09:00:00', '12:00:00'].map((time, index) => ({
        dt_txt: `2026-09-27 ${time}`, main: { temp_min: 10 + index, temp_max: 20 + index },
        weather: [{ description: 'clear sky', icon: '01d' }]
      }));
      const days = processForecastData({ list: entries });
      if (days.length !== 1 || days[0].temp_max !== 21) throw new Error('Unexpected selected reading');
    });
    rejects('Malformed forecast is rejected', () => processForecastData({ list: 'unexpected' }));
    rejects('Empty city search is rejected', () => getWeatherData(''));
    rejects('Out-of-range location is rejected', () => getWeatherDataByCoords(91, 0));
  </script>
</body>
</html>
