<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Forecast App</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Animated Weather Backgrounds -->
    <div id="weatherBackground" class="weather-background">
        <!-- Sunny weather elements -->
        <div id="sunnyElements" class="weather-layer sunny-bg">
            <div class="sun-rays"></div>
            <div class="sun"></div>
        </div>
        
        <!-- Cloudy weather elements -->
        <div id="cloudyElements" class="weather-layer cloudy-bg hidden">
            <div class="cloud cloud-1"></div>
            <div class="cloud cloud-2"></div>
            <div class="cloud cloud-3"></div>
            <div class="cloud cloud-4"></div>
        </div>
        
        <!-- Rainy weather elements -->
        <div id="rainyElements" class="weather-layer rainy-bg hidden">
            <div class="rain-container">
                <div class="rain-drop"></div>
                <div class="rain-drop"></div>
                <div class="rain-drop"></div>
                <div class="rain-drop"></div>
                <div class="rain-drop"></div>
                <div class="rain-drop"></div>
                <div class="rain-drop"></div>
                <div class="rain-drop"></div>
                <div class="rain-drop"></div>
                <div class="rain-drop"></div>
                <div class="rain-drop"></div>
                <div class="rain-drop"></div>
                <div class="rain-drop"></div>
                <div class="rain-drop"></div>
                <div class="rain-drop"></div>
            </div>
        </div>
        
        <!-- Stormy weather elements -->
        <div id="stormyElements" class="weather-layer stormy-bg hidden">
            <div class="rain-container">
                <div class="rain-drop"></div>
                <div class="rain-drop"></div>
                <div class="rain-drop"></div>
                <div class="rain-drop"></div>
                <div class="rain-drop"></div>
                <div class="rain-drop"></div>
                <div class="rain-drop"></div>
                <div class="rain-drop"></div>
                <div class="rain-drop"></div>
                <div class="rain-drop"></div>
            </div>
            <div class="lightning"></div>
        </div>
        
        <!-- Night weather elements -->
        <div id="nightElements" class="weather-layer night-bg hidden">
            <div class="moon"></div>
            <div class="star"></div>
            <div class="star"></div>
            <div class="star"></div>
            <div class="star"></div>
            <div class="star"></div>
            <div class="star"></div>
            <div class="star"></div>
            <div class="star"></div>
            <div class="star"></div>
            <div class="star"></div>
        </div>
        
        <!-- Snowy weather elements -->
        <div id="snowyElements" class="weather-layer snowy-bg hidden">
            <div class="snowflake">❄</div>
            <div class="snowflake">❄</div>
            <div class="snowflake">❄</div>
            <div class="snowflake">❄</div>
            <div class="snowflake">❄</div>
            <div class="snowflake">❄</div>
            <div class="snowflake">❄</div>
            <div class="snowflake">❄</div>
            <div class="snowflake">❄</div>
            <div class="snowflake">❄</div>
        </div>
    </div>

    <div class="container">
        <!-- Header with title and unit toggle -->
        <header class="app-header">
            <h1>✨ Weather Forecast</h1>
            <div class="unit-toggle">
                <label class="toggle-switch">
                    <input type="checkbox" id="unitToggle">
                    <span class="slider">
                        <span class="unit-label unit-celsius">°C</span>
                        <span class="unit-label unit-fahrenheit">°F</span>
                    </span>
                </label>
            </div>
        </header>

        <!-- Search section -->
        <section class="search-section">
            <div class="search-container">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="🔍 Search city..." 
                    autocomplete="off"
                >
                <button id="searchButton" class="search-btn">
                    <span>🔍</span>
                </button>
                <button id="locationButton" class="location-btn" title="Use my location">
                    <span>📍</span>
                </button>
            </div>
            
            <div id="recentSearches" class="recent-searches">
                <!-- Recent city chips inserted here -->
            </div>
        </section>

        <!-- Loading spinner -->
        <div id="loadingSpinner" class="loading-spinner hidden">
            <div class="spinner"></div>
            <p>✨ Loading weather data...</p>
        </div>

        <!-- Error message -->
        <div id="errorMessage" class="error-message hidden">
            <span class="error-icon">⚠️</span>
            <p id="errorText">Error message here</p>
        </div>

        <!-- Current weather display -->
        <section id="currentWeather" class="current-weather">
            <div class="weather-header">
                <h2 id="cityName">London, UK</h2>
                <p id="weatherDate" class="weather-date">Monday, September 7, 2026</p>
            </div>
            
            <div class="weather-main">
                <div class="weather-icon-container">
                    <div class="weather-icon-placeholder">☀️</div>
                </div>
                <div class="temperature-container">
                    <span id="temperature" class="temperature">24</span>
                    <span id="temperatureUnit" class="temperature-unit">°C</span>
                </div>
                <p id="weatherDescription" class="weather-description">Sunny & Clear</p>
            </div>

            <div class="weather-details">
                <div class="detail-item">
                    <span class="detail-label">Feels like</span>
                    <span id="feelsLike" class="detail-value">25°</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Humidity</span>
                    <span id="humidity" class="detail-value">48%</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Wind Speed</span>
                    <span id="windSpeed" class="detail-value">3.6 m/s</span>
                </div>
            </div>
        </section>

        <!-- 5-day forecast display -->
        <section id="forecastSection" class="forecast-section">
            <h3>📅 5-Day Forecast</h3>
            <div id="forecastCards" class="forecast-cards">
                <div class="forecast-card">
                    <div class="forecast-date">Tue</div>
                    <div class="forecast-icon">🌤️</div>
                    <div class="forecast-temps">
                        <span class="forecast-high">22°</span>
                        <span class="forecast-low">14°</span>
                    </div>
                </div>
                <div class="forecast-card">
                    <div class="forecast-date">Wed</div>
                    <div class="forecast-icon">🌧️</div>
                    <div class="forecast-temps">
                        <span class="forecast-high">18°</span>
                        <span class="forecast-low">12°</span>
                    </div>
                </div>
                <div class="forecast-card">
                    <div class="forecast-date">Thu</div>
                    <div class="forecast-icon">🌩️</div>
                    <div class="forecast-temps">
                        <span class="forecast-high">16°</span>
                        <span class="forecast-low">10°</span>
                    </div>
                </div>
                <div class="forecast-card">
                    <div class="forecast-date">Fri</div>
                    <div class="forecast-icon">☁️</div>
                    <div class="forecast-temps">
                        <span class="forecast-high">19°</span>
                        <span class="forecast-low">11°</span>
                    </div>
                </div>
                <div class="forecast-card">
                    <div class="forecast-date">Sat</div>
                    <div class="forecast-icon">☀️</div>
                    <div class="forecast-temps">
                        <span class="forecast-high">23°</span>
                        <span class="forecast-low">15°</span>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
